name: PB1 backend checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_DB: smart_soc_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d smart_soc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci_test_user@127.0.0.1:5432/smart_soc_ci_test
      TEST_DATABASE_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint, type-check, and test
        run: make check PYTHON=python
      - name: Dependency, license, and secret scans
        run: make audit PYTHON=python
