name: PB4 baseline checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_DB: smart_soc_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d smart_soc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis-broker:
        image: redis:8.2.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis-cache:
        image: redis:8.2.11
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.2'
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint, type-check, and test without IP networking
        env:
          CI_DISPOSABLE_SERVICES: '1'
        run: python scripts/ci_isolated_checks.py
      - name: Dependency, license, and secret scans
        run: make audit PYTHON=python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint, type-check, tests and build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=low

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV: development
      DEV_INSECURE_COOKIES: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate throwaway development secrets
        run: python3 scripts/bootstrap_dev_secrets.py
      - name: Validate Compose configuration
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml --profile e2e config --quiet
      - name: Build and start the full stack
        run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 300
      - name: Check proxy configuration and health
        run: |
          docker compose -f infra/docker-compose.yml exec -T nginx nginx -t
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          echo
          docker compose -f infra/docker-compose.yml ps -a
      - name: Run the real Compose Playwright smoke
        run: python3 scripts/run_compose_e2e.py --disposable
      - name: Redacted service diagnostics
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps -a
          docker compose -f infra/docker-compose.yml logs --no-color --tail=120 2>&1 | python3 scripts/redact_compose_logs.py
      - name: Stop disposable stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans
