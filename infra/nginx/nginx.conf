worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # The backend emits sanitized request logs. Avoid reopening container pipes
    # as a non-root user and avoid logging query strings or credentials here.
    access_log off;

    # An empty value is omitted on HTTP; HSTS is meaningful only over TLS.
    map $https $soc_hsts {
        default "";
        on "max-age=31536000; includeSubDomains";
    }

    server {
        listen 8080 default_server;
        server_name _;
        include /etc/nginx/soc-site.conf;
    }

    # Empty by default. An operator can mount the documented TLS server here.
    include /etc/nginx/tls-enabled/*.conf;
}
