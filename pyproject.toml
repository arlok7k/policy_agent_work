[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-soc-host"
version = "0.1.0"
description = "SMART SOC host platform baseline"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.5",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "argon2-cffi==25.1.0",
  "uvicorn==0.54.0",
  "celery[redis]==5.7.0",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "httpx2==2.16.0",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "celery-types==0.26.0",
  "pre-commit==4.7.0",
  "pip-tools==7.6.2",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "detect-secrets==1.5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.auth" = ["legacy_roles.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "--strict-markers --tb=short"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.15"
mypy_path = "backend"
strict = true
warn_unreachable = true
